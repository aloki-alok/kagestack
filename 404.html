<meta name="description" content="What kagestack does for coding agents, how it works, and why each change shipped.">
<style>:root{--ease:cubic-bezier(.19,1,.22,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px)}
.bar{display:grid;grid-template-columns:var(--rail) 1fr auto;align-items:center;height:64px;padding:0 36px;gap:0 56px;max-width:var(--page);margin:0 auto}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.keys{display:flex;gap:40px;font:500 12px var(--mono);letter-spacing:.06em}
.keys a{text-decoration:none;color:var(--ink2)}.keys a:hover{color:var(--ink)}
.keys a.on{color:var(--ink)}
.keys b{font-weight:400;color:var(--mid);margin-right:8px}
.tools{display:flex;gap:8px}
.btn{font:500 12px var(--mono);background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.04em}
.btn:hover{border-color:var(--mid)}
.btn kbd{color:var(--mid);margin-left:10px;font:inherit}
:root{--rail:300px;--col:720px;--page:calc(var(--rail) + var(--col) + 128px)}
.grid{display:grid;grid-template-columns:var(--rail) minmax(0,var(--col));gap:0 56px;padding:0 36px;max-width:var(--page);margin:0 auto}
.hero{padding-top:72px;padding-bottom:56px}
.eyebrow{font:500 12px var(--mono);color:var(--mid);letter-spacing:.08em}
h1{font:400 clamp(30px,3.4vw,44px)/1.18 var(--serif);letter-spacing:-.01em;margin:16px 0 18px}
.stand{font-size:16px;line-height:1.75;color:var(--ink2);margin:0 0 34px;max-width:620px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:0 24px;margin:0}
.meta dt{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mid)}
.meta dd{margin:6px 0 0;font:13.5px var(--sans);color:var(--ink)}
.meta dd code{font-size:12.5px}
.rule{border:0;border-top:1px solid var(--line);margin:0}
main{padding:56px 0 120px;min-width:0}
nav.tree{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto;padding:56px 0 40px}
.tree .h{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mid);margin-bottom:14px}
.tree a{display:grid;grid-template-columns:28px 1fr;text-decoration:none;color:var(--mid);font:12.5px/1.5 var(--mono);padding:5px 0}
.tree a .n{color:var(--line);color:color-mix(in srgb,var(--mid) 70%,transparent)}
.tree a:hover{color:var(--ink)}
.tree a.on{color:var(--ink)}
.tree a.on .n{color:var(--accent)}
.tree .sub a{grid-template-columns:28px 14px 1fr;font-size:12px;padding:3px 0}
.tree .sub a::before{content:"";grid-column:2;width:7px;height:1px;background:var(--line);align-self:center}
.tree .sub a span{grid-column:3}
.tree .sub a.on{color:var(--ink)}
.prog{margin-top:24px;display:flex;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--mid)}
.prog i{flex:1;height:2px;background:var(--line);position:relative}
.prog i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--ink)}
figure{margin:0 0 44px;border:1px solid var(--line);background:var(--panel)}
figure .d{padding:28px 20px;overflow:auto;text-align:center;cursor:zoom-in}
figure .d svg{max-width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 14px;font:500 11px var(--mono);letter-spacing:.08em;color:var(--mid)}
.prose h2{font:400 22px/1.3 var(--serif);margin:48px 0 12px;scroll-margin-top:90px}
.prose h2 a.anchor{opacity:0;margin-left:10px;font:13px var(--mono);color:var(--mid);text-decoration:none}
.prose h2:hover a.anchor{opacity:1}
.prose p,.prose li{color:var(--ink2);max-width:68ch}
.prose p{margin:0 0 18px}
.prose a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--mid);text-underline-offset:4px;text-decoration-thickness:2px}
.prose a:hover{text-decoration-color:var(--ink)}
.prose a:focus-visible,.keys a:focus-visible,.tree a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
code{font:13px var(--mono);background:var(--code);padding:1px 5px}
pre{background:var(--code);padding:16px;overflow:auto}
pre code{background:none;padding:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:72px}
.pager a{border:1px solid var(--line);padding:16px 18px;text-decoration:none;transition:border-color .25s var(--ease)}
.pager a:hover{border-color:var(--ink)}
.pager .k{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mid)}
.pager .t{font:400 17px/1.3 var(--serif);margin-top:8px}
.pager .next{text-align:right;grid-column:2}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:none;z-index:20;padding-top:12vh}
.scrim.open{display:block}
.palette{max-width:620px;margin:0 auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:18px 20px;font:16px var(--sans);color:var(--ink);outline:none}
.res{max-height:50vh;overflow:auto}
.res a{display:block;padding:12px 20px;text-decoration:none;border-bottom:1px solid var(--line2)}
.res a.sel,.res a:hover{background:var(--panel)}
.res .rt{font-weight:500}.res .rs{font-size:13px;color:var(--mid);margin-top:2px}
.res mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit}
.res .empty{padding:18px 20px;color:var(--mid);font-size:14px}
.zoom{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;overflow:auto;padding:40px;cursor:zoom-out}
.zoom.open{display:block}.zoom svg{width:100%;height:auto;max-height:none}
.fade{animation:in .5s var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:980px){:root{--rail:0px}.grid{grid-template-columns:1fr;gap:0;padding:0 16px}nav.tree,.hero>.sp{display:none}.bar{grid-template-columns:1fr auto;padding:0 16px}.keys{display:none}.meta{grid-template-columns:1fr 1fr;gap:14px 24px}}
.logo .word{font:var(--logo)}
.logo .t{font:500 11px var(--mono);color:var(--mid);letter-spacing:.08em}
body{background-image:var(--texture,none)}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;z-index:40;background:var(--paper);padding:8px 12px;border:1px solid var(--line)}
h1,.prose h2{text-wrap:balance}
@media (max-width:520px){.logo .t{display:none}.tools{gap:6px}.btn{padding:6px 9px}.btn kbd{display:none}}
@media (max-width:980px){.hero{padding-bottom:40px}}
.logo{align-items:center}.logo .mk{display:block;width:32px;height:32px}.logo .mk .t{fill:var(--ink)}.logo .mk .g{fill:var(--paper)}.logo .mk svg,.btn.icon svg{display:block;width:100%;height:100%}.btn.icon{width:34px;padding:8px}

<script>const D={"pages":[{"id":"how-kagestack-works","file":"README.md","title":"How kagestack works","md":"```mermaid\nflowchart TD\n  ASK[\"You ask for something\"]:::you --> START[\"Session starts: pick the playbook for the job\"]\n  START --> PB[\"Playbook: steps that each end in proof\"]\n  PB --> EDIT[\"Each edit\"]\n  EDIT -->|new comment, skipped test, function over 60 lines| BACK[\"Sent back to the agent\"]:::stop\n  EDIT --> COMMIT[\"Commits\"]\n  COMMIT --> END[\"Turn ends\"]\n  END -->|new commits| REV[\"A fresh reviewer reads them\"]:::check\n  END -->|reply ends by asking you| DEC[\"Sent back: decide, then list the calls\"]:::stop\n  END --> YOU[\"Reply to you\"]:::you\n  LONG[\"Third compaction\"]:::check -.-> HAND[\"Hand off to a fresh session\"]\n```\n\n# How kagestack works\n\nOne of my Claude Code sessions ran for 24 days and got compacted 153 times. In another, a decision we'd agreed on got undone right after a compaction. kagestack is the set of habits and guard rails I built so agents do careful work even when nobody's watching that closely.\n\n## Playbooks guide the work\n\nThink of a good kitchen: nobody re-invents how to make the stock each morning, there's a card on the wall. A playbook is that card for one kind of job. When a session starts, the agent gets a short map, so a bug goes to `bug-fix`, a new feature to `feature`, and so on. Every step ends in something the agent has to show, like a failing test before the fix. You never type a command. See [Playbooks](playbooks.md).\n\n## Checks catch what text can't\n\nA rule in a prompt is a sticky note. It works until the context fills up and the note falls off. A check runs every single time. So when a mistake keeps coming back, it becomes a check, not more text. Hooks send back an edit that adds a code comment, a reply that asks you something the agent could decide, and commits nobody reviewed. See [What runs on its own](hooks.md), [How work gets reviewed](review.md) and [The ks command](ks-command.md).\n\n## Every change is tested before it ships\n\nI don't trust a rule just because it sounds right. A new playbook or rule ships only if a blind test shows agents actually do better with it, and some of my ideas tied and never shipped. See [How a change earns its place](testing-changes.md) and the [changes, release by release](changes.md).\n"},{"id":"playbooks","file":"playbooks.md","title":"Playbooks","md":"```mermaid\nflowchart LR\n  ASK[\"Your ask\"]:::you --> MAP[\"Session map: kind of task\"]\n  MAP --> BUG[\"Something broken: bug-fix\"]\n  MAP --> FEAT[\"New behavior: feature\"]\n  MAP --> REF[\"Cleanup: refactor\"]\n  MAP --> MORE[\"... 9 more\"]\n  BUG --> STEPS[\"Steps, each ending in proof\"]:::check\n  FEAT --> STEPS\n  REF --> STEPS\n  MORE --> STEPS\n```\n\n# Playbooks\n\nA playbook is a short list of steps for one kind of job. Each step ends in something the agent has to show before it moves on, so \"done\" means proven, not just claimed. You don't pick one: the session map reads what you asked, and the agent loads the right playbook by itself.\n\nThe seven playbooks that change code or test a change also read the shared principles first: delete before adding, use what exists, prove it on the real thing, and fix the cause where it first went wrong. The list below comes straight from each playbook's own file, so it always matches what agents read.\n\n## bug-fix\n\nFix a bug from a red repro to a proven fix. Use when something is broken, failing, or wrong.\n\n1. Get it red\n2. Find the root cause\n3. Fix at the cause\n4. Go green\n5. Commit red before green\n6. Close the class\n\n## catch-up\n\nTell the user what changed in this session since their last message, and every call that waits on them, so they can decide from the reply alone. Use when they come back after being away from a long run and ask what happened. Not for a question about the step you just took.\n\n1. Gather what changed\n2. List the calls that wait on them\n3. Write it\n\n## clear-comments\n\nClear comments out of code by making the code say what they said. Use when asked to remove, review or clean up comments or lint suppressions, or when `ks check` fails on them.\n\n1. Fix the scope\n2. Start the `kagestack:comment-reviewer` agent\n3. Check the report\n4. Delete,\n5. Reshape\n6. Record\n7. Encode\n8. Prove it\n\n## decision-log\n\nKeep a log of each decision in a long or unattended run, with the proof behind it, so a person can trust work they did not watch. Use for work that outlasts one sitting, overnight or loop runs, or when asked to show your work.\n\n1. Open the log\n2. Add a row at each decision point\n3. Never edit a row\n4. Audit the log before you hand back\n\n## eval\n\nTest whether a skill, playbook, prompt or rule change makes agents better, before shipping it. Use when adding or changing a skill, comparing skills that do the same job, or checking that a rule is followed.\n\n1. Write what winning means\n2. Build the task\n3. Run it\n4. Read the runs that lost\n5. Decide\n\n## explain\n\nMake something a person looks at to understand or decide, such as an explainer, a design summary, a report, a diagram or a decision page. Use before you make any page, doc or diagram for a reader.\n\n1. Pick the route\n2. Write the answer in at most five lines\n3. Draw one picture that carries those lines\n4. Put decisions right after the answer,\n5. Keep only what the reader must understand,\n6. Look at it\n7. Change the part, not the page\n\n## feature\n\nBuild a new feature or change what the product does. Use when adding, extending, or changing behavior.\n\n1. Restate\n2. Find what exists\n3. Name the data shape\n4. Check the consequences\n5. Sign-off on big changes only\n6. Plan big work as a sprint\n7. Build in slices\n8. Prove it on the real app\n9. Fresh review\n10. Flag what you passed\n\n## garden\n\nFind the mistakes a repo keeps repeating and make each one impossible to write again. Use for a sweep of a repo's history when no single bug is open, such as \"the same bugs keep coming back\" or \"this old code keeps breaking\". A bug you are fixing now goes to bug-fix.\n\n1. Read the history\n2. Rank them\n3. Pick the strongest check that holds\n4. Prove each check on the real past mistake\n5. Delete what the check replaces\n6. Open one pull request per mistake\n\n## handoff\n\nPause work so a fresh session can pick it up. Use when stopping mid-task or wrapping up for the day.\n\n1. Stop at a safe point\n2. Commit your work\n3. Push the branch,\n\n## interrogate\n\nHave reviewers on two different models try to break a risky change, and keep only the findings a rerun proves. Use for a diff that touches money, auth, permissions, call dispatch, data writes or a migration, when two reviews disagree, or when asked to interrogate or stress test a change.\n\n1. Fix the scope and the intent\n2. Give each reviewer its own worktree\n3. Start both reviewers at once, in the background\n4. Rerun every finding's command yourself\n5. Remove both worktrees,\n\n## investigate\n\nAnswer how something works or why it was built this way, without changing code. Use for how, why, where does this live, are we sure, or what would break questions.\n\n1. Restate the question\n2. How: trace the real path\n3. Why: read the record, not the code\n4. Say what you could not answer,\n\n## perf\n\nMake something measurably faster, or explain why it is slow. Use for slow pages, slow queries, high latency, timeouts, or a speedup or regression claim.\n\n1. Write the claim first,\n2. Measure the baseline\n3. Find the limiter\n4. Fix the cheapest way first,\n5. Measure again,\n6. Check the number is real\n\n## pr\n\nOpen a pull request a reviewer can read in a minute. Use when opening a pull request or rewriting its description.\n\n1. Clean the branch\n2. Title\n3. Find the template\n4. Body\n5. Open it ready for review,\n6. Queue the merge after the fresh review, then move on\n\n## refactor\n\nChange the structure of code without changing what it does. Use for cleanups, restructures, renames, removing dead code, or untangling a module.\n\n1. Pin the behavior\n2. Name the target shape\n3. Prove what is dead before deleting it\n4. Delete first,\n5. Move in small steps\n6. Prove nothing changed\n7. Show it was worth it\n\n## scout\n\nFind the modern, faster option before picking or keeping a dev tool or library. Use when choosing a linter, formatter, type checker, package manager, test runner, bundler, git hooks or a library, or when `ks tools` names a swap.\n\n1. Name the job\n2. Find candidates\n3. Check maintenance\n4. Check adoption\n5. Find the gaps\n6. Stop on a red flag\n7. Measure on this repo\n8. Treat each autofix as a code change\n\n"},{"id":"hooks","file":"hooks.md","title":"What runs on its own","md":"```mermaid\nsequenceDiagram\n  participant S as Session\n  participant K as kagestack\n  S->>K: starts\n  K-->>S: playbook map, and \"decide, don't ask\"\n  S->>K: starts a subagent\n  K-->>S: worker rules for that subagent\n  S->>K: runs a shell command\n  K-->>S: sends a foreground wait loop to the background\n  S->>K: edits a file\n  K-->>S: sends back a new comment, skipped test or long function\n  S->>K: ends a turn\n  K-->>S: review new commits, and decide instead of asking\n  S->>K: resumes after its third compaction\n  K-->>S: finish the step, then hand off\n```\n\n# What runs on its own\n\nSeven hooks run inside every Claude Code session that has kagestack installed, kind of like the checks a pilot runs without thinking about them. You never type anything. Each hook either adds a short note to what the agent reads, or sends its work back with the reason.\n\n## When a session starts\n\nThe agent reads the map from kinds of task to playbooks, so it picks up the right one without being asked. The same note tells it to decide instead of asking you, because a pile of \"should I go ahead?\" questions is pretty much the opposite of help. It asks only before a deploy, a production write, money, a migration, a delete it can't undo, or a message to people.\n\n## When a subagent starts\n\nA plain subagent gets the worker rules: do the job in its brief, back every claim with a command and its output, and stop after the third failed try on one idea. Named agents with their own instructions are left alone.\n\n## Before each shell command\n\nA command that waits in the foreground is sent back before it runs. That means a loop that sleeps between checks, `gh run watch`, `gh pr checks --watch`, or `watch`. The session freezes on that wait and can't work on anything else. So the agent runs the wait in the background and keeps working until the notification arrives. For any other condition, it waits with the Monitor tool. `KS_WAIT=0` turns the check off.\n\n## After each edit\n\nAn edit that adds a code comment, skips a test, or grows a function past 60 lines is sent back. The agent puts the reason in a name, a test or the commit message instead. `ks check` applies the same rule to a whole branch.\n\n## When a turn ends\n\nIf the turn made commits that nobody reviewed, the agent starts a fresh reviewer before it may finish. See [How work gets reviewed](review.md). If the reply ends by asking you something it could decide, it is sent back to decide and list its calls.\n\n## After the third compaction\n\nOnce a session you watch has been compacted three times, it keeps only summaries of its early decisions. The agent is asked to finish its step, write a handoff and tell you to continue in a fresh session. `KS_HANDOFF_AFTER` sets the count.\n"},{"id":"review","file":"review.md","title":"How work gets reviewed","md":"```mermaid\nflowchart TD\n  W[\"Agent commits work\"] --> E[\"Turn ends\"]\n  E --> R[\"Fresh reviewer: your request and the commit range, nothing else\"]:::check\n  R --> F[\"Findings it proved with a command\"]\n  F --> FIX[\"Agent fixes each one with a test\"]\n  F --> WHY[\"Or gives a reason to dismiss it\"]\n  FIX --> DONE[\"Reply to you\"]:::you\n  WHY --> DONE\n```\n\n# How work gets reviewed\n\nWhen you write something important, you ask a friend to read it, and you don't hand them your notes first. Same idea here. Every commit an agent makes in a session you watch gets read by a second agent before the turn ends. The reviewer gets your request and the commit range, and none of the first agent's reasoning, so it really does read the work cold.\n\n## What the reviewer looks for\n\n1. Bugs a user would hit: wrong output, a crash, lost data, a security hole, a caller that breaks.\n2. Code that already did the job. Two pieces of code for one job is a finding. The fix is to reuse the old code, or to move its callers to the new code and delete the old one.\n3. Weak tests. Each new test has to fail when the behavior breaks, and still pass when the code is restructured with the same output.\n4. The one fact the change is safe because of, and how far that fact is proven.\n\nIt only reports findings it confirmed by running something. Guesses don't count.\n\n## When it runs, and when it doesn't\n\nIt runs once per turn that adds commits, after the work rather than alongside it, because it's judging the finished commits. It skips headless runs and turns that still have background work going. There's one gap, though: replies, messages and uncommitted edits get no reviewer at all. `KS_REVIEW=0` turns it off, and `KS_REVIEW=1` turns it on where Claude Code can't tell whether you're watching.\n"},{"id":"ks-command","file":"ks-command.md","title":"The ks command","md":"```mermaid\nflowchart LR\n  SETUP[\"ks setup\"] --> TOML[\"kagestack.toml: install, lint and test commands\"]\n  TOML --> CI[\"ks ci: runs them, then ks check\"]\n  HOOK[\"ks git-hook\"] --> CHECK[\"ks check on every commit\"]\n  CI --> CHECK\n  DOC[\"ks doctor\"] -.->|checks| TOML\n```\n\n# The ks command\n\n`ks` is the command-line half of kagestack. Hooks only live inside Claude Code, so `ks` carries the same checks into CI and to any other agent, Codex included.\n\nInstall it with `uv tool install git+https://github.com/aloki-alok/kagestack`.\n\n## Checks\n\n- `ks check` fails a branch that adds a code comment, a lint suppression that names no rule, a skipped test, or a function grown past 60 lines. `ks check --all` counts what is already there.\n- `ks git-hook` runs `ks check` on each commit you make, in every repo on the machine that has no git hooks setup of its own. It skips merges, cherry-picks and reverts, and lets a commit through with a note when `ks` is not installed.\n\n## Setting up a repo\n\n- `ks setup` finds the repo's install, lint and test commands and writes them to `kagestack.toml`, with a CI job pinned to this release. It shows both files and asks first. It never guesses a test command.\n- `ks ci` runs those commands in order, then `ks check`. That is the CI job.\n- `ks doctor` says whether the setup is complete and whether CI runs a current release.\n\n## Helpers\n\n- `ks stuck` lists your open pull requests that can't move and your open sprints, with the reason and who moves each one next: an agent or a person. `--org \u003cname>` covers a whole org.\n- `ks tools` names faster, maintained replacements for old dev tools, such as ruff for flake8.\n- `ks screens \u003curl or file>` screenshots a page on phones, a tablet and desktops in Chromium, WebKit and Firefox, and lists sideways scroll, page errors and console errors.\n- `ks package` copies the playbooks to `.agents/skills`, for Codex and OpenCode.\n"},{"id":"testing-changes","file":"testing-changes.md","title":"How a change earns its place","md":"```mermaid\nflowchart LR\n  IDEA[\"A new playbook or rule\"] --> BLIND[\"A fresh agent builds real-looking tasks, blind\"]\n  BLIND --> RUNS[\"5 runs with it, 5 without, same model\"]\n  RUNS --> WIN{\"Wins an outcome by 4 of 5 runs?\"}\n  WIN -->|yes| SHIP[\"Ships\"]:::check\n  WIN -->|no| TIE[\"Tie: not shipped, written down\"]:::stop\n```\n\n# How a change earns its place\n\nEvery line of a playbook gets read in every session, so a rule that changes nothing isn't free. It's a small tax forever. That's why each change has to prove itself before it ships.\n\n## The agent that wrote it doesn't test it\n\nIf you write the exam for your own essay, you'll pass. So the agent that made a change never builds its test. A fresh agent that hasn't read the change gets the goal in plain words, the two versions to compare, and a budget, and builds the test from there.\n\n## Tasks look like real work\n\nEach task is a small repo with a git history and a short ask, typed the way a person actually types. Nothing in it says test or eval, because an agent that knows it's being watched behaves differently (people do too!). Before any run, the tester writes down what a user would check, like \"the bug is gone\" or \"no unrelated file changed\", and a script scores it.\n\n## A tie doesn't ship\n\nEach version runs 5 times per task. A version wins an outcome only when it leads by at least 4 of 5 runs. Anything closer is a tie, and a tie at the same cost doesn't ship. Every result gets written down, ties included, so nobody tries the same idea twice. See the [changes, release by release](changes.md).\n"},{"id":"changes","file":"changes.md","title":"Changes, release by release","md":"```mermaid\nflowchart TD\n  A[\"Nov 18: first playbooks, ks check, blind evals, turn-end review\"] --> B[\"Nov 19: sessions start with the right playbook\"]\n  B --> C[\"Nov 21: comment cleanup, pages for readers\"]\n  C --> D[\"Nov 22: decide instead of asking, ks check on every commit\"]\n  D --> E[\"Nov 24: reviewer finds rebuilt code, handoff, garden\"]\n  E --> F[\"Nov 25: agents queue the merge and wait in the background\"]\n  F --> G[\"Nov 26: ks check reads yaml, css and shell comments, ks stuck says why a pull request waits, big features run as sprints\"]:::check\n```\n\n# Changes, release by release\n\nkagestack changes almost every day, and I kept losing track of why. So each release here says what you or an agent saw before it, what changed, why, and the test behind it. The ideas that tied in a blind test are here too, marked as not shipped, because a failed idea is still worth remembering.\n\n## 0.35.1 · Nov 26 · The lowest open sprint is current\n\n- **Before:** `ks stuck` matched only titles that start with `Sprint N`, so the dashboard's `Phone sprint 2` to `4` never showed. It also took the newest sprint as current. A team that plans sprints ahead would see the planned sprint handed to an agent and the live one flagged as left behind.\n- **After:** Any title with `sprint N` counts, and each prefix is its own series. The lowest open sprint in a series is current, later ones wait, and a sprint with every issue closed is still listed to close.\n- **Why:** The first real repo with sprints planned ahead broke both rules the day they shipped.\n- **Proof:** No eval. Four tests were red before the fix. On the dashboard, Phone sprint 2 now hands #2301 to an agent. On Kage, Sprint 2 is current with #433.\n\n## 0.35.0 · Nov 26 · Big features run as a sprint of issues\n\n- **Before:** A feature that took several pull requests had no list of its parts. Sprints existed only where someone opened them by hand, and they piled up: Kage had five open at once, and the four older ones still held 9 issues nobody moved.\n- **After:** The `feature` playbook opens a `Sprint N: \u003coutcome>` milestone for work bigger than one pull request. Each pull request gets one issue with a `P0`, `P1` or `P2` label and a \"Done when\" line, and its body says `Closes #N`. The sprint closes only after the outcome works on the deployed app. `ks stuck` lists open sprints: the newest hands its most urgent issue with no pull request to an agent, and older ones go to a person to move their leftovers.\n- **Why:** Merged is not done. A sprint gives a big change one place where \"finished\" means deployed and checked, and `ks stuck` makes a stalled sprint as visible as a stalled pull request.\n- **Proof:** No eval. An agent without the step never opens a sprint, so there is no tie to test against. 12 new `ks stuck` tests run against a stand-in `gh`. On the real Kage repo it named #659 (P1) as Sprint 7's next issue and skipped #661, which has a pull request. `ks stuck --org Omnidim --org aloki-alok` ran in 20 s.\n\n## 0.34.1 · Nov 26 · A version tag after a pinned action passes\n\n- **Before:** `ks check` counted `# v7.0.1` after `uses: actions/checkout@\u003chash>` as a comment. A pull request that bumped a pinned action failed on its new tag.\n- **After:** A `#` comment that holds only a version, such as `# v4` or `# v7.0.1`, passes. Any word after the version fails as before.\n- **Why:** The tag is the only record of which release a hash is. A sweep that deleted every comment in the dashboard removed 8 of them, and a reviewer caught it.\n- **Proof:** No eval. One test passes the tag, and it was red before the change. A second test fails prose after a tag, and it goes red if the pattern loses its end anchor.\n\n## 0.34.0 · Nov 26 · ks stuck says why each pull request waits\n\n- **Before:** Open pull requests piled up and nobody could see why. One count found 129 open: 41 with a conflict, 35 with red checks, 31 waiting on an approval. Most had not moved in weeks, because each one waited for somebody to open it and look.\n- **After:** `ks stuck` lists your open pull requests that can't move. Each one gets a reason and a next move, for an agent or for a person. A pull request with running checks or a queued merge is left out. After 14 idle days the move goes to a person, so an agent never revives work that may be dead. `--org` covers a whole org and `--json` feeds another tool.\n- **Why:** An agent can rebase a branch or fix a red check, but only once something tells it which pull request needs that. This list is that signal.\n- **Proof:** No eval, since no agent text changed. 22 tests run the command against a stand-in `gh`. On the real backlog it named 37 for an agent and 93 for a person.\n\n## 0.33.4 · Nov 26 · Comments in yaml, css and shell scripts fail too\n\n- **Before:** `ks check` read python and js-family files only. An agent added a three-line comment to a GitHub workflow in a dashboard pull request, and the check passed it. `oxlint-disable` lines in js files were counted as comments.\n- **After:** Comments in yaml, css and shell scripts fail like any other. Their tool directives pass when they name a rule: `yaml-language-server:`, `yamllint disable`, `stylelint-disable`, `shellcheck disable=`. `oxlint-disable` is read like `eslint-disable`, so a bare one fails.\n- **Why:** The owner caught the workflow comment by eye. The rule \"no comments\" lived in the check for some files and only in text for the rest.\n- **Proof:** No eval. Each language and directive has a test that failed before the change. `ks check --all` on the dashboard's `pr-check.yml` now lists its comments.\n\n## 0.33.3 · Nov 25 · Queue the merge after the fresh review\n\n- **Before:** The `pr` playbook queued auto-merge right after opening the pull request. The fresh review runs when the turn ends, so the review came after the merge was already queued.\n- **After:** The playbook queues auto-merge once the review's findings are fixed and pushed.\n- **Why:** On Nov 25, #44 and #45 each merged at a green head before their review fixes were pushed, and each fix needed another pull request.\n- **Proof:** No eval. Seen on two pull requests.\n\n## 0.33.2 · Nov 25 · The wait check reads shell quoting the way bash does\n\n- **Before:** 0.33.1 stripped quotes with a regex. A comment like `# it's here` or an escaped quote fooled it and hid a real `gh run watch`. A 20 KB unclosed heredoc made every shell command wait 2 seconds, and 50 KB took more than 8.\n- **After:** A small scanner reads quotes, escapes and comments the way bash does, in one pass. Loop words inside a commit message or a heredoc no longer trip the check. A wait inside `bash -c \"...\"`, an `if` block, braces, backticks, an `env` prefix, `gh -R` or `gh pr checks -w` is caught. The code is split into simple commands first, and each one is matched from its start, so the check takes time in line with the command's length.\n- **Why:** A fresh reviewer found both in 0.33.1. Python's `shlex` was the first choice, but it drops the newline that ends a comment, so two commands read as one. Three later reviews each found one more slow input for a single regex over the whole command, which is why the split came in.\n- **Proof:** No eval. Each case has a test that failed before the fix. A fuzz of 1,001 commands of 50 KB, made from every separator, prefix and command pairing, finished in at most 0.25 seconds each. The slowest one took 0.18 seconds at 200 KB.\n\n## 0.33.1 · Nov 25 · A commit message that mentions watch runs\n\n- **Before:** The wait check refused a commit message or heredoc with a line like `x; watch tests`. A `time` or `sudo` prefix hid a real `gh run watch`.\n- **After:** Quoted text and heredoc bodies are ignored when the check looks for a watch command. A `sudo`, `time`, `timeout N` or `VAR=value` prefix no longer hides one.\n- **Why:** A fresh reviewer found both cases in 0.33.0.\n- **Proof:** No eval. Each case has a test that failed before the fix.\n\n## 0.33.0 · Nov 25 · A foreground wait loop is sent to the background\n\n- **Before:** An agent waited for a staging deploy with a `for` loop that slept 15 seconds between checks. The session sat frozen for 2 minutes 22 seconds. Claude Code blocks a bare foreground `sleep`, but it lets the same `sleep` run inside a loop.\n- **After:** A new hook runs before each shell command. It sends back a foreground loop that sleeps, `gh run watch`, `gh pr checks --watch` and `watch`. The reason it gives names the better tool: run in the background, or wait with Monitor.\n- **Why:** The owner's rule \"never block on a wait\" lived only in text, and the agent skipped it at the exact moment it mattered.\n- **Proof:** No eval. One headless session, shown in the pull request: the wait loop was refused, and the agent moved the wait to the background.\n\n## 0.32.1 · Nov 25 · Queue a merge only where the repo allows auto-merge\n\n- **Before:** On a repo that does not allow auto-merge, `gh pr merge --auto` merged the pull request at once, before CI finished, wherever branch rules required no checks.\n- **After:** The `pr` playbook reads the repo's `allow_auto_merge` first, and passes `--auto` only when it is on.\n- **Why:** A pull request merged 2 minutes before its CI passed, on the day 0.32.0 shipped.\n- **Proof:** No eval. Seen on one pull request.\n\n## 0.32.0 · Nov 25 · Agents queue the merge instead of waiting on CI\n\n- **Before:** After opening a pull request, a session sat and polled CI until it could merge, and a long CI run stalled the whole task.\n- **After:** The `pr` playbook queues the merge with GitHub's auto-merge (`gh pr merge --auto`) and moves on. GitHub merges once the required checks and reviews pass.\n- **Why:** The polling loop was one of four stall causes in the owner's Nov 24 retro.\n- **Proof:** No eval. The `pr` eval runs in a local repo with no GitHub, so it cannot reach a merge.\n\n## 0.31.0 · Nov 24 · A docs site explains each hook, playbook and release\n\n- **Before:** The reason for each change lived only in commit messages and an eval table. Two features merged without a version bump, so installed copies missed them for about 2.5 hours.\n- **After:** aloki-alok.github.io/kagestack explains what runs, how review works, and why each release shipped. A test fails a release that has no entry on this page.\n- **Why:** The owner wants to understand each change without reading commits.\n- **Proof:** No eval.\n\n## 0.30.0 · Nov 24 · Agents find the mistakes a repo keeps repeating\n\n- **Before:** Review caught the same repeated mistake by hand, and nothing read a repo's own fix history.\n- **After:** The `garden` playbook reads fix commits, reverts and review comments, groups them by mistake, and adds a check for each repeated one.\n- **Why:** Old bad code keeps teaching new code the same mistakes, and no part of kagestack learned from a repo's own history.\n- **Proof:** When the ask names the mistake, agents guarded the old bugs 10/10 vs 10/10 and cited 2 past fixes 8/10 vs 3/10. When it does not, guard catches the old bugs 5/5 vs 2/5, cited past fixes 5/5 vs 0/5, cost 1.16x. \"The old code here is bad\" went to `refactor` 0/5 vs 0/5.\n\n## Tried, not shipped: read the ask first (Nov 24)\n\n- **Before:** Agents sometimes read \"see how we can reuse\" as a request for advice, not a build.\n- **After:** Session text that makes the agent read the ask first tied with 0.29.0 on every outcome, so it did not ship.\n- **Why:** In RESULTS.md, Sonnet already picks the likely job and keeps scope on these asks. A retest needs real past asks that agents got wrong.\n- **Proof:** Right fix or cause 10/10 vs 10/10, no added work 14/15 vs 13/15, named its reading 5/10 vs 6/10, expert word glossed 9/10 vs 9/10, raw log quoted 4/5 vs 5/5, cost 1.0x.\n\n## 0.29.0 · Nov 24 · Review finds rebuilt code, and long sessions get a handoff\n\n**The reviewer looks for code that already did the job**\n\n- **Before:** The end-of-turn review passed new code that rebuilt something the repo already had.\n- **After:** The reviewer searches for each new piece. A duplicate becomes a finding that names the existing code's file and line.\n- **Why:** In two days, review passed three changes that rebuilt something the repo already had.\n- **Proof:** No eval.\n\n**Agents get a handoff prompt after the third compaction**\n\n- **Before:** One session ran 24 days and was compacted 153 times, and agreed decisions got undone after compactions.\n- **After:** After the third compaction, the agent finishes its step, runs the handoff playbook, and points the owner to a fresh session.\n- **Why:** Each compaction drops about 440k tokens to a summary, and 31 of 244 sessions in the last week passed three.\n- **Proof:** No eval.\n\n## 0.28.1 · Nov 23 · Component tests pass `ks check`\n\n- **Before:** `ks check` sent back the `@vitest-environment jsdom` line at the top of a component test as a new comment.\n- **After:** `ks check` treats that line, and the `@jest-environment` form, as a runner directive.\n- **Why:** A frontend repo with 44 such files couldn't take a new component test without a workaround.\n- **Proof:** No eval.\n\n## 0.28.0 · Nov 22 · Agents cannot hide a failing test or grow a function past 60 lines\n\n- **Before:** Agents skipped a failing test, or piled new logic into one function, and `ks check` let both through.\n- **After:** `ks check` sends back a new unconditional skip or focus, and any function this change pushes past 60 lines.\n- **Why:** Agents hide a failing test by skipping it. Old long functions can still change, so small fixes in old code stay unblocked.\n- **Proof:** No eval.\n\n## 0.27.1 · Nov 22 · The git hook explains a read-only git config\n\n- **Before:** `ks git-hook` crashed with a traceback when Nix home-manager owned the git config.\n- **After:** It prints git's error and the `core.hooksPath` line to add by hand. A rerun then only refreshes the hook scripts.\n- **Why:** A config managed by home-manager is a read-only symlink, so `git config --global` fails.\n- **Proof:** No eval.\n\n## 0.27.0 · Nov 22 · Commits run `ks check`, for any agent\n\n- **Before:** `ks check` ran only in CI, and the repos I work in didn't have that job. One of three retry tasks still committed a comment.\n- **After:** A hook checks each file Claude edits. `ks git-hook` checks staged lines on every commit, for any agent or person.\n- **Why:** Nothing checked comments during a session, and the edit hook only reaches Claude Code.\n- **Proof:** No eval.\n\n## 0.26.0 · Nov 22 · Agents decide instead of asking for a plain \"go ahead\"\n\n- **Before:** An agent ended its reply with a question, and the owner answered \"go ahead\".\n- **After:** `decide.py` blocks such a reply once. The agent keeps the question for a one-way door, otherwise acts and lists the calls it made.\n- **Why:** In seven days, 194 of 1,454 human turns answered a closing question, and at least 39 were a plain \"go ahead\".\n- **Proof:** No eval.\n\n## 0.25.0 · Nov 21 · Explain pages shrink to outcomes and approach\n\n**List rows show a name and a before and after outcome**\n\n- **Before:** Each row of an ideas page hid its code but still carried two sentences of explanation.\n- **After:** Each row shows a name and a before to after outcome line.\n- **Why:** The owner chose the outcome line over a tiny picture, because every item has one and not every item draws well.\n- **Proof:** Outcome phrase on 80% of rows 5/5 vs 0/5, rows of 30 words or fewer 5/5 vs 3/5, all items kept 5/5 vs 5/5, cost 1.06x.\n\n**An opened row shows Now and Fix flows**\n\n- **Before:** Opening a row gave a paragraph and a sentence about a file path.\n- **After:** An opened row shows short Now and Fix step flows with file and line chips.\n- **Why:** The owner skipped the paragraphs. Short flows carry the same facts at a glance.\n- **Proof:** Now and Fix steps 5/5 vs 0/5, words per opened row 27 vs 75, all tickets and locations kept 5/5 vs 5/5.\n\n**No evidence and no dropdowns on the page**\n\n- **Before:** Evidence sat behind a click, which still cost a row of noise.\n- **After:** A page holds only what is broken or missing, the approach and what gets built. Code locations and tickets stay in the repo.\n- **Why:** The owner does not open dropdowns, and hidden evidence taught nothing.\n- **Proof:** Nothing hidden 5/5 vs 0/5, no ticket ids or file paths 5/5 vs 0/5, median 172 vs 255 words, cause, fix and feature visible 4/5 vs 3/5.\n\n**Each item picks its form from its content**\n\n- **Before:** One Now and Fix arrow chain was stamped on every item, and the owner could not read it.\n- **After:** An item shows a screen mock when the change is visible, a number when it is a number, otherwise one plain sentence each.\n- **Why:** The arrow chains were one template forced on every item.\n- **Proof:** No code names 5/5 vs 5/5, screen changes as mocks 5/5 vs 0/5, real numbers kept and gaps marked 5/5 vs 0/5, no arrow chains 5/5 vs 0/5, cost 1.09x.\n\n**Each item says why it matters, measured or marked a guess**\n\n- **Before:** The owner could not tell from an ideas page whether any item was worth building.\n- **After:** Items carry how often each problem hits customers. A page without that number says so instead of recommending.\n- **Why:** Nothing counted how often each problem hit customers.\n- **Proof:** No eval.\n\n**Reverted: concept pages built up in steps**\n\n- **Before:** Concept pages did not draw pictures one part at a time.\n- **After:** The step-by-step change was dropped and the skill went back to the version that passed.\n- **Why:** No run of five built pictures up, and concept pages grew from a median of 237 to 850 words.\n- **Proof:** Pictures built up 0/5 vs 0/5, plain definition first 2/5 vs 0/5, median 850 vs 237 words, cost 1.4x, not shipped.\n\n## 0.24.0 · Nov 21 · Agents write one-screen pages for readers\n\n- **Before:** Agents put everything they found on a page, so readers got fourteen sections and ten tables and read none.\n- **After:** The `explain` playbook picks the route first, writes the answer in five lines, and caps the visible page at one screen.\n- **Why:** Agents treat a page as the place to put everything they found.\n- **Proof:** Short page 9/10 vs 0/10 (median 284 vs 1,310 words), one diagram 4/10 vs 0/10, all decisions and key facts kept 10/10 vs 10/10, cost 1.0 to 1.5x.\n\n## 0.23.0 · Nov 21 · Comment cleanup keeps decisions and hacks\n\n- **Before:** Deleting a \"why we chose X\" comment lost the decision, and an out-of-scope hack was only listed in the reply.\n- **After:** A decision comment becomes an ADR in the repo's decision folder. A hack comment opens an issue that names the fix at its source.\n- **Why:** In a smoke run the reviewer turned a hack into a helper. The hack stayed and no issue opened.\n- **Proof:** No eval.\n\n**`ks check` prints the size of a cleanup**\n\n- **Before:** `ks check --all` on an old repo gave no sense of the cleanup size.\n- **After:** The run ends with \"N comments on M lines\".\n- **Why:** The count sizes the cleanup before anyone starts it.\n- **Proof:** No eval.\n\n**`scout` says to pin tests before a new linter's autofixes**\n\n- **Before:** A new linter's autofixes could change code with no test to catch it.\n- **After:** `scout` tells the agent to pin tests first.\n- **Why:** A published monorepo migration hit oxlint fixes that renamed a destructured key and broke a React Native alias.\n- **Proof:** No eval.\n\n## 0.22.0 · Nov 21 · Old comments get a verdict, and bare suppressions fail\n\n**Agents clear old comments with a fresh reviewer**\n\n- **Before:** `ks check` stopped new comments, but old comments in touched code stayed, and deleting one lost what it warned about.\n- **After:** The `clear-comments` playbook hands each comment to a read-only agent. Each gets a verdict: delete, reshape, encode as a test, or keep with proof.\n- **Why:** Deleting a comment loses whatever it was warning about, so an agent that did not write it judges each one.\n- **Proof:** No eval.\n\n**`ks check` fails suppressions that name no rule**\n\n- **Before:** A bare `noqa`, `type: ignore` or `@ts-ignore` silenced every check on that line.\n- **After:** `ks check` fails them on new lines and asks for the rule name. Scoped forms still pass.\n- **Why:** A bare suppression also hides the checks that catch real bugs.\n- **Proof:** No eval.\n\n## 0.21.0 · Nov 19 · Agents check a web page on phones and in every browser\n\n- **Before:** Agents testing a web change wrote their own Playwright scripts, each with a different device list and no layout check.\n- **After:** `ks screens` opens a page on 7 screens, saves a screenshot of each, and lists sideways scroll and its causes.\n- **Why:** Agents kept writing their own scripts, so one tool replaces them.\n- **Proof:** No eval.\n\n## 0.20.0 · Nov 19 · Each session starts with the matching playbook\n\n- **Before:** A fresh session had the playbook routes in its CLAUDE.md and still did not load `kagestack:bug-fix` until asked.\n- **After:** A SessionStart hook points each session at the matching playbook. A one-line edit or a one-file lookup may skip it.\n- **Why:** Skill descriptions alone do not make the model reach for a playbook.\n- **Proof:** No eval.\n\n## 0.19.1 · Nov 18 · A fresh reviewer checks new commits when a turn ends\n\n**Interactive turns end with one fresh review**\n\n- **Before:** Nobody reviewed the commits a turn left behind unless the owner asked.\n- **After:** A Stop hook asks Claude to start one fresh reviewer on unreviewed commits. `KS_REVIEW=0` turns it off.\n- **Proof:** No eval.\n\n**Eval runs ignore the author's own instruction files**\n\n- **Before:** Eval runs loaded the author's `~/.claude` files on both sides, so \"without\" was not plain Claude.\n- **After:** Both sides run with those files excluded.\n- **Why:** A probed run knew the author's name and quoted the global file's heading.\n- **Proof:** RESULTS.md says every run before 2026-11-19 loaded those files on both sides.\n\n## 0.18.1 · Nov 18 · `ks` help and output read cleanly\n\n- **Before:** `ks` help and output were long and uneven.\n- **After:** Help lists commands in the order you use them. Every command ends on one result line, and a step left for you starts with `next:`.\n- **Proof:** No eval.\n\n## 0.18.0 · Nov 18 · Playbooks reach Codex and OpenCode\n\n- **Before:** `uvx` installs only `src/ks`, so `ks` could not hand the playbooks to other clients.\n- **After:** `ks package` writes the playbooks for Codex and OpenCode, each with a `kagestack-` prefix and its own `principles.md`.\n- **Why:** Both clients find skills in `.agents/skills` on their own. `--check` fails on drift, and `ks doctor` warns on a stale copy.\n- **Proof:** No eval.\n\n## 0.17.0 · Nov 18 · `ks doctor` checks the setup\n\n- **Before:** Nothing said whether `kagestack.toml` was complete or the CI workflow ran a real release.\n- **After:** `ks doctor` reports both. A pin that is no release fails, and an older release warns.\n- **Proof:** No eval.\n\n## 0.16.0 · Nov 18 · `ks setup` and `ks ci` write and run the repo's checks\n\n- **Before:** Each repo wired its own checks by hand.\n- **After:** `ks setup` drafts `kagestack.toml` from commands it can trace to a file. `ks ci` runs them in order, then `ks check`.\n- **Why:** An empty test command fails, so a repo cannot go green without naming its tests or saying \"none\".\n- **Proof:** No eval.\n\n## 0.15.0 · Nov 18 · Agents learn when a faster tool exists\n\n- **Before:** Agents kept the old standard tool without checking for a newer one.\n- **After:** `ks tools` names each older tool in a repo with its faster, maintained swap. The `scout` playbook covers categories the list misses.\n- **Why:** The list's release dates were checked on GitHub on 2026-11-18. On a typical frontend repo it names eslint, husky and npm.\n- **Proof:** No eval.\n\n## 0.14.0 · Nov 18 · CI is pinned and worker rules reach only worker agents\n\n- **Before:** A moved CI action tag could change what runs, and worker rules also reached custom agents such as reviewers.\n- **After:** CI actions are pinned by commit. The hook matches only plain worker agents, `pyproject` and `plugin.json` share one version, and `ks --version` prints it.\n- **Why:** Custom agents bring their own prompt.\n- **Proof:** No eval.\n\n## 0.13.0 · Nov 18 · The playbooks stop contradicting each other\n\n- **Before:** Playbooks and worker rules disagreed. For example, `pr` asked every commit to pass while `bug-fix` commits a red test first.\n- **After:** `pr` drops that ask, `feature` lists what it passed, and `handoff` commits your work, not everything, so secrets stay local.\n- **Proof:** No eval.\n\n## 0.12.0 · Nov 18 · Fixes cover every form of the fault\n\n**Agents fix every form of the fault**\n\n- **Before:** \"Smallest change\" stopped short. An Excel CSV fix left CRLF in 6/6 runs while plain Claude fixed both.\n- **After:** The principle is the smallest change that fixes every form of the fault. Size matters after the whole fault is listed.\n- **Why:** Two blind evals found the smallest change stopped short.\n- **Proof:** Hidden tests 39/40 vs 37/40 in the third blind eval, so the loss is gone but correctness did not win. Cost 1.4x.\n\n**A moved comment is not a new comment**\n\n- **Before:** Splitting a module failed CI because every moved comment counted as new.\n- **After:** A comment counts as new only if no removed line in the same diff ends with its text.\n- **Why:** The failure pushed agents to delete good comments.\n- **Proof:** No eval.\n\n**The README fits one screen**\n\n- **Before:** The README was long, with eval tables inside it.\n- **After:** It says what the plugin does in one screen, and eval tables live in `evals/RESULTS.md`.\n- **Proof:** No eval.\n\n## 0.11.0 · Nov 18 · `bug-fix` keeps what callers rely on\n\n- **Before:** The `bug-fix` playbook changed the bad-input error in 8/10 runs.\n- **After:** Step 3 keeps the return type, raised errors and bad-input handling, and checks bad input before and after. Evals now go blind first.\n- **Why:** A blind eval found the smaller fix changed the error from `ValueError` to `InvalidOperation`. My own evals rewarded my own steps twice.\n- **Proof:** Hidden tests 24/40 vs 28/40, a proven red test 39/40 vs 8/40, cost 1.6x. The plugin left CRLF unfixed in 6/6 runs.\n\n## 0.10.0 · Nov 18 · Evals score outcomes on a clean setup\n\n- **Before:** The baseline loaded the author's whole `~/.claude` setup, and facts mostly copied playbook steps.\n- **After:** Both sides run with no user CLAUDE.md, skills, plugins or hooks. Facts check outcomes a user would check, and traps were added.\n- **Why:** A critic found kagestack won by definition when facts copied its own steps. The old baseline ran the author's wrap-up skill.\n- **Proof:** No eval.\n\n## 0.1.0 to 0.9.0, Nov 18: the first playbooks\n\n- **Plugin foundation (0.0.1):** README with the bar, MIT license and the manifests that let Claude Code install the repo. The README says how kagestack heals: an agent fixes its failing check, and a repeated mistake becomes a check.\n- **`bug-fix` playbook (0.1.0, 0.1.1):** Six steps from a red repro to a proven fix, each ending on a done-when line. The repro must be fast and deterministic. Author-built eval: both pages fixed 5/5 vs 0/5.\n- **Worker rules for every subagent (0.2.0):** A SubagentStart hook injects `hooks/worker.md` into each subagent, so no brief has to remember it.\n- **`feature` playbook (0.3.0):** Nine steps from restating the goal to flagging old code the work passed. Later versions file each flag as an issue after searching open ones.\n- **Shared principles (0.4.0):** One file of design, verification and working principles that the playbooks read before step 1.\n- **`refactor` playbook (0.5.0):** Seven steps that change structure and keep behavior, pinning current behavior in its own commit first. Author-built eval: 5/5 vs 5/5.\n- **`investigate` playbook (0.6.0):** Read-only answers to how and why questions. Author-built eval with a wrong premise: 5/5 vs 5/5.\n- **`perf` playbook (0.6.0):** Measure before and after, and tie every change to a number. Author-built eval: 45x faster vs 95x faster.\n- **`eval` playbook and `evals/run.py` (0.6.0, 0.8.0):** Test a skill change on a trap task before shipping it. `run.py` copies a small repo per run and scores with plain code.\n- **`handoff` playbook (0.7.0):** A 10-line wip note a fresh agent can start from. Author-built eval: pushed with the note 5/5 vs 2/5.\n- **Each rule said once (0.7.0):** Worker rules keep only what every subagent needs. Playbook rules live once in `principles.md`.\n- **`pr` playbook (0.8.0):** Fill the repo or org pull request template, else write a one-minute briefing. Author-built eval: template filled 5/5 vs 0/5.\n- **`ks check` (0.8.0, 0.9.0):** The first check that runs as code. It fails new comments and docstrings, lets tool directives through, and prints a clean line when the change is clean.\n- **Evals for each playbook (0.8.0, 0.9.0):** Evals for `pr`, `feature-flags`, `bug-fix`, `refactor`, `perf`, `handoff`, `investigate` and babysit. Author-built `feature-flags`: 5/5 vs 5/5.\n- **Babysit tried, not shipped (0.9.0):** The babysit playbook tied a plain agent on every fact, so it did not ship. Its eval is the bar for the next try.\n- **README and test setup (0.9.0):** The README says how to stay updated, how to run evals, and what enforces each rule. `pytest` collects only `tests/`, not the eval fixture repos.\n"}]};
