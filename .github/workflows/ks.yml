name: ks

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked pytest
      - run: uv run --locked ks check --base "$BASE"
        env:
          BASE: origin/${{ github.base_ref }}
