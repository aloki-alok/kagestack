[project]
name = "kagestack"
version = "0.34.1"
description = "checks that keep coding agents writing clean code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ast-grep-cli==0.51.3"]

[project.scripts]
ks = "ks.cli:main"

[dependency-groups]
dev = [
    "playwright==1.65.0",
    "pytest>=8",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ks"

[tool.ruff]
extend-exclude = ["evals/*/repo"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
