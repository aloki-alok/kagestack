[project]
name = "kagestack"
version = "0.18.1"
description = "checks that keep coding agents writing clean code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ast-grep-cli==0.51.3"]

[project.scripts]
ks = "ks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ks"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
